; Fixed ATC_MiThermometer Observer-Only Mode Example
; This version initializes NimBLE before ATC_MiThermometer

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
framework = arduino
board = esp32dev
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Library dependencies
lib_deps =
    ; Use the fixed NimBLE-Arduino with observer-only support
    NimBLE-Arduino=symlink://../../
    
    ; ATC_MiThermometer library
    git+file:///home/mrnice/Documents/PlatformIO/libs/workspace_Class-ATC_MiThermometer#feature/replace-logging-macro

build_flags = 
    -D CONFIG_BT_ENABLED=1
    -D CONFIG_BT_NIMBLE_ENABLED=1
    -D CONFIG_ENABLE_ARDUINO_DEPENDS=1
    -D CORE_DEBUG_LEVEL=4
    
    ; Observer-only mode configuration
    -D CONFIG_BT_NIMBLE_ROLE_OBSERVER_ONLY=1
    -D CONFIG_BT_NIMBLE_ROLE_CENTRAL=0
    -D CONFIG_BT_NIMBLE_ROLE_PERIPHERAL=0
    -D CONFIG_BT_NIMBLE_ROLE_BROADCASTER=0
    -D CONFIG_BT_NIMBLE_ROLE_OBSERVER=1
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -D CONFIG_BT_NIMBLE_WHITELIST_SIZE=8
    
    ; Hardware timestamps for accurate beacon timing
    -D CONFIG_NIMBLE_CPP_ATT_VALUE_TIMESTAMP_ENABLED=1
    -D CONFIG_NIMBLE_CPP_ATT_VALUE_HRTIMESTAMP_ENABLED=1