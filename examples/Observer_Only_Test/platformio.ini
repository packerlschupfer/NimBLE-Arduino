; Observer-Only Mode Test Example
; Demonstrates NimBLE-Arduino with ~200-400KB flash savings

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Use local NimBLE-Arduino library
lib_deps = 
    NimBLE-Arduino=symlink://../../

build_flags = 
    -D CONFIG_BT_ENABLED=1
    -D CONFIG_BT_NIMBLE_ENABLED=1
    -D CORE_DEBUG_LEVEL=5
    -D CONFIG_ENABLE_ARDUINO_DEPENDS=1
    ; Observer-only mode RE-ENABLED
    -D CONFIG_BT_NIMBLE_ROLE_OBSERVER_ONLY=1
    -D CONFIG_BT_NIMBLE_ROLE_CENTRAL=0
    -D CONFIG_BT_NIMBLE_ROLE_PERIPHERAL=0
    -D CONFIG_BT_NIMBLE_ROLE_BROADCASTER=0
    -D CONFIG_BT_NIMBLE_ROLE_OBSERVER=1
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1  ; CRITICAL: Must be 1 for ESP32 controller
    -D CONFIG_BT_NIMBLE_WHITELIST_SIZE=1
    -D CONFIG_BT_NIMBLE_SM_LEGACY=0
    -D CONFIG_BT_NIMBLE_SM_SC=0
    -D CONFIG_BT_NIMBLE_L2CAP_COC_MAX_NUM=0

; Note: The observer-only build script is handled by the library itself
